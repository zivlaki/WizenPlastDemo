<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolyCore — Plastics Management System</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d0f12;
        --bg2: #13161b;
        --bg3: #1a1e26;
        --bg4: #22273200;
        --panel: #181c23;
        --panel2: #1e2330;
        --border: #2a3040;
        --border2: #38465a;
        --accent: #f5820a;
        --accent2: #ffaa44;
        --accent-dim: rgba(245, 130, 10, 0.12);
        --accent-glow: rgba(245, 130, 10, 0.25);
        --blue: #3a8ef6;
        --blue-dim: rgba(58, 142, 246, 0.12);
        --green: #22c97a;
        --green-dim: rgba(34, 201, 122, 0.12);
        --red: #f04060;
        --red-dim: rgba(240, 64, 96, 0.12);
        --yellow: #f5c518;
        --yellow-dim: rgba(245, 197, 24, 0.12);
        --text: #d8e0ec;
        --text2: #8a9ab8;
        --text3: #4a5870;
        --mono: "Share Tech Mono", monospace;
        --head: "Rajdhani", sans-serif;
        --body: "Exo 2", sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--body);
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg2);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      /* Layout */
      .app {
        display: flex;
        height: 100vh;
      }
      .sidebar {
        width: 220px;
        min-width: 220px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      .sidebar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          var(--accent),
          var(--blue),
          transparent
        );
      }
      .sidebar-logo {
        padding: 22px 20px 18px;
        border-bottom: 1px solid var(--border);
      }
      .sidebar-logo .brand {
        font-family: var(--head);
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 3px;
        color: var(--accent);
        text-transform: uppercase;
      }
      .sidebar-logo .sub {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--text3);
        letter-spacing: 2px;
        margin-top: 3px;
        text-transform: uppercase;
      }
      .sidebar-nav {
        flex: 1;
        padding: 12px 0;
        overflow-y: auto;
      }
      .nav-section-label {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--text3);
        letter-spacing: 2px;
        padding: 12px 20px 6px;
        text-transform: uppercase;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 20px;
        cursor: pointer;
        border-left: 2px solid transparent;
        transition: all 0.15s;
        font-family: var(--head);
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 1px;
        color: var(--text2);
        text-transform: uppercase;
        user-select: none;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
      }
      .nav-item.active {
        color: var(--accent);
        border-left-color: var(--accent);
        background: var(--accent-dim);
      }
      .nav-item .icon {
        font-size: 16px;
        width: 20px;
        text-align: center;
      }
      .sidebar-footer {
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text3);
      }
      .status-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        margin-right: 6px;
        box-shadow: 0 0 6px var(--green);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* Main content */
      .main {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        height: 52px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        flex-shrink: 0;
      }
      .topbar-title {
        font-family: var(--head);
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text);
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .topbar-time {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text3);
      }
      .topbar-badge {
        background: var(--accent);
        color: #000;
        font-family: var(--mono);
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 2px;
        font-weight: bold;
      }
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 28px;
      }

      /* Cards */
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, var(--accent), transparent);
        opacity: 0.5;
      }
      .card-title {
        font-family: var(--head);
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text2);
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-title .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }

      /* Stat cards */
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 24px;
      }
      .stat-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 18px 20px;
        position: relative;
        overflow: hidden;
        cursor: default;
        transition: border-color 0.2s;
      }
      .stat-card:hover {
        border-color: var(--border2);
      }
      .stat-card .accent-bar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
      }
      .stat-label {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text3);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .stat-value {
        font-family: var(--head);
        font-weight: 700;
        font-size: 30px;
        line-height: 1;
        color: var(--text);
        margin-bottom: 4px;
      }
      .stat-sub {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text3);
      }
      .stat-delta {
        font-family: var(--mono);
        font-size: 11px;
        margin-top: 6px;
      }
      .delta-up {
        color: var(--green);
      }
      .delta-down {
        color: var(--red);
      }

      /* Table */
      .data-table {
        width: 100%;
        border-collapse: collapse;
      }
      .data-table th {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text3);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 8px 12px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      .data-table td {
        padding: 10px 12px;
        font-family: var(--body);
        font-size: 13px;
        color: var(--text);
        border-bottom: 1px solid rgba(42, 48, 64, 0.5);
      }
      .data-table tr:last-child td {
        border-bottom: none;
      }
      .data-table tbody tr {
        cursor: pointer;
        transition: background 0.1s;
      }
      .data-table tbody tr:hover {
        background: rgba(255, 255, 255, 0.03);
      }
      .data-table .mono {
        font-family: var(--mono);
        font-size: 12px;
      }

      /* Badges */
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 2px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: bold;
      }
      .badge-green {
        background: var(--green-dim);
        color: var(--green);
        border: 1px solid rgba(34, 201, 122, 0.3);
      }
      .badge-red {
        background: var(--red-dim);
        color: var(--red);
        border: 1px solid rgba(240, 64, 96, 0.3);
      }
      .badge-yellow {
        background: var(--yellow-dim);
        color: var(--yellow);
        border: 1px solid rgba(245, 197, 24, 0.3);
      }
      .badge-blue {
        background: var(--blue-dim);
        color: var(--blue);
        border: 1px solid rgba(58, 142, 246, 0.3);
      }
      .badge-orange {
        background: var(--accent-dim);
        color: var(--accent);
        border: 1px solid rgba(245, 130, 10, 0.3);
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 3px;
        border: none;
        cursor: pointer;
        font-family: var(--head);
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        transition: all 0.15s;
      }
      .btn-primary {
        background: var(--accent);
        color: #000;
      }
      .btn-primary:hover {
        background: var(--accent2);
        box-shadow: 0 0 16px var(--accent-glow);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text2);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        border-color: var(--border2);
        color: var(--text);
      }
      .btn-danger {
        background: var(--red-dim);
        color: var(--red);
        border: 1px solid rgba(240, 64, 96, 0.3);
      }
      .btn-danger:hover {
        background: rgba(240, 64, 96, 0.2);
      }
      .btn-success {
        background: var(--green-dim);
        color: var(--green);
        border: 1px solid rgba(34, 201, 122, 0.3);
      }
      .btn-success:hover {
        background: rgba(34, 201, 122, 0.2);
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 11px;
      }

      /* Grid helpers */
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
      }
      .mb-4 {
        margin-bottom: 16px;
      }
      .mb-6 {
        margin-bottom: 24px;
      }
      .flex {
        display: flex;
      }
      .flex-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .gap-2 {
        gap: 8px;
      }
      .gap-3 {
        gap: 12px;
      }

      /* Input */
      .input-group {
        margin-bottom: 14px;
      }
      .input-label {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text3);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .input {
        width: 100%;
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 8px 12px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
      }
      .input:focus {
        border-color: var(--accent);
      }
      select.input {
        cursor: pointer;
      }
      .input-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      /* Donut chart */
      .donut-wrap {
        position: relative;
        width: 120px;
        height: 120px;
      }
      .donut-label {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      .donut-label .big {
        font-family: var(--head);
        font-weight: 700;
        font-size: 22px;
        color: var(--text);
        line-height: 1;
      }
      .donut-label .small {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* Bar chart */
      .bar-chart {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 80px;
      }
      .bar-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .bar {
        width: 100%;
        border-radius: 2px 2px 0 0;
        min-height: 4px;
        transition: height 0.3s;
      }
      .bar-label {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--text3);
      }
      .bar-val {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--text2);
      }

      /* Machine detail */
      .machine-detail {
        animation: fadeIn 0.2s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text3);
        cursor: pointer;
        letter-spacing: 1px;
        margin-bottom: 20px;
        transition: color 0.15s;
      }
      .back-btn:hover {
        color: var(--accent);
      }

      .machine-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 24px;
      }
      .machine-id {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--accent);
        letter-spacing: 2px;
        margin-bottom: 4px;
      }
      .machine-name {
        font-family: var(--head);
        font-weight: 700;
        font-size: 28px;
        color: var(--text);
        letter-spacing: 1px;
      }
      .machine-type {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text3);
        margin-top: 4px;
      }

      .spec-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .spec-item {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 12px 14px;
      }
      .spec-key {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--text3);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .spec-val {
        font-family: var(--mono);
        font-size: 14px;
        color: var(--text);
      }

      /* Live gauge */
      .gauge-row {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
      }
      .gauge-item {
        flex: 1;
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 14px 16px;
      }
      .gauge-label {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text3);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .gauge-bar-track {
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 6px;
      }
      .gauge-bar-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.5s;
      }
      .gauge-value {
        font-family: var(--mono);
        font-size: 18px;
        color: var(--text);
      }
      .gauge-unit {
        font-size: 11px;
        color: var(--text3);
      }

      /* Actions */
      .action-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .action-card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 14px;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
      }
      .action-card:hover {
        border-color: var(--accent);
        background: var(--accent-dim);
      }
      .action-card .action-icon {
        font-size: 22px;
        margin-bottom: 6px;
      }
      .action-card .action-label {
        font-family: var(--head);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 1px;
        color: var(--text2);
        text-transform: uppercase;
      }

      /* Log */
      .log-entry {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 8px 0;
        border-bottom: 1px solid rgba(42, 48, 64, 0.5);
        font-size: 12px;
      }
      .log-time {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text3);
        white-space: nowrap;
        padding-top: 2px;
      }
      .log-msg {
        color: var(--text2);
        font-family: var(--body);
      }
      .log-tag {
        font-family: var(--mono);
        font-size: 9px;
        padding: 1px 6px;
        border-radius: 2px;
        margin-right: 6px;
      }

      /* Modal / overlay */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        backdrop-filter: blur(4px);
      }
      .modal {
        background: var(--panel2);
        border: 1px solid var(--border2);
        border-radius: 6px;
        padding: 28px;
        width: 560px;
        max-width: 95vw;
        max-height: 85vh;
        overflow-y: auto;
        animation: fadeIn 0.2s ease;
        position: relative;
      }
      .modal-title {
        font-family: var(--head);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 20px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      .modal-close {
        position: absolute;
        top: 16px;
        right: 16px;
        background: none;
        border: none;
        color: var(--text3);
        font-size: 18px;
        cursor: pointer;
      }
      .modal-close:hover {
        color: var(--text);
      }

      /* Result box */
      .result-box {
        background: var(--bg);
        border: 1px solid var(--accent);
        border-radius: 4px;
        padding: 18px;
        margin-top: 18px;
        animation: fadeIn 0.3s ease;
      }
      .result-title {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--accent);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .result-row {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid rgba(42, 48, 64, 0.5);
        font-size: 13px;
      }
      .result-row:last-child {
        border-bottom: none;
      }
      .result-key {
        color: var(--text3);
        font-family: var(--mono);
        font-size: 11px;
      }
      .result-val {
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
      }
      .result-main {
        font-family: var(--head);
        font-weight: 700;
        font-size: 32px;
        color: var(--accent);
        margin: 8px 0 12px;
      }

      /* Inventory */
      .inv-progress {
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        margin-top: 6px;
      }
      .inv-progress-fill {
        height: 100%;
        border-radius: 2px;
      }

      /* Timeline */
      .timeline {
        position: relative;
        padding-left: 20px;
      }
      .timeline::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--border);
      }
      .timeline-item {
        position: relative;
        padding-bottom: 18px;
      }
      .timeline-dot {
        position: absolute;
        left: -16px;
        top: 3px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1px solid currentColor;
      }
      .timeline-time {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text3);

        {
          id: "calc-shot",
          name: "Shot Weight Calculator",
          desc: "Calculate required shot weight from part geometry and material density",
          icon: "⚖️",
          color: "--blue",
          tag: "Injection",
          fields: [
            {
              key: "volume",
              label: "Part Volume",
              unit: "cm³",
              default: "45",
              type: "number",
            },
            {
              key: "density",
              label: "Material Density",
              unit: "g/cm³",
              default: "1.05",
              type: "number",
            },
            {
              key: "runners",
              label: "Runner Volume",
              unit: "cm³",
              default: "8",
              type: "number",
            },
            {
              key: "cavities",
              label: "Number of Cavities",
              unit: "",
              default: "4",
              type: "number",

            {
              key: "safety",
              label: "Safety Factor",
              unit: "%",
              default: "5",
              type: "number",
            },
          ],
          compute: (v) => {
            const partWt = v.volume * v.density;
            const totalWt =
              (partWt * v.cavities + v.runners * v.density) *
              (1 + v.safety / 100);
            return {
              main: totalWt.toFixed(1) + " g",
              label: "Total Shot Weight",
              rows: [
                { k: "Part weight (per cavity)", v: partWt.toFixed(2) + " g" },
                {
                  k: "Runner weight",
                  v: (v.runners * v.density).toFixed(2) + " g",
                },
                {
                  k: "Net part weight × cavities",
                  v: (partWt * v.cavities).toFixed(2) + " g",
                },
                { k: "Safety factor applied", v: v.safety + "%" },
                { k: "Total shot weight", v: totalWt.toFixed(1) + " g" },
              ],
            };

        {
          id: "calc-cycle",
          name: "Cycle Time Estimator",
          desc: "Estimate injection moulding cycle time from wall thickness and material",
          icon: "⏱️",
          color: "--accent",
          tag: "Injection",
          fields: [
            {
              key: "wallThick",
              label: "Max Wall Thickness",
              unit: "mm",
              default: "3.2",
              type: "number",
            },
            {
              key: "moldTemp",
              label: "Mould Temperature",
              unit: "°C",
              default: "45",
              type: "number",
            },
            {
              key: "meltTemp",
              label: "Melt Temperature",
              unit: "°C",
              default: "220",
              type: "number",
            },
            {
              key: "ejectTemp",
              label: "Ejection Temperature",
              unit: "°C",
              default: "90",
              type: "number",
            },
            {
              key: "thermalDiff",
              label: "Thermal Diffusivity",
              unit: "mm²/s",
              default: "0.077",
              type: "number",
            },
            {
              key: "fillTime",
              label: "Fill + Pack Time",
              unit: "s",
              default: "4",
              type: "number",
            },
          ],
          compute: (v) => {
            const s = v.wallThick / 2;
            const factor = Math.log(
              (8 / Math.PI ** 2) *
                ((v.meltTemp - v.moldTemp) / (v.ejectTemp - v.moldTemp)),
            );
            const coolingTime =
              (s ** 2 / (Math.PI ** 2 * v.thermalDiff)) * Math.abs(factor);
            const openClose = 3.5;
            const total = coolingTime + v.fillTime + openClose;
            const cyclesPerHour = Math.floor(3600 / total);
            return {
              main: total.toFixed(1) + " s",
              label: "Estimated Cycle Time",
              rows: [
                { k: "Cooling time", v: coolingTime.toFixed(1) + " s" },
                { k: "Fill + Pack time", v: v.fillTime + " s" },
                { k: "Open / Close / Eject", v: openClose + " s" },
                { k: "Total cycle time", v: total.toFixed(1) + " s" },
                { k: "Theoretical cycles/hour", v: cyclesPerHour + " cycles" },
              ],
            };
          },
        },
        {
          id: "calc-clamp",
          name: "Clamping Force Calculator",
          desc: "Calculate required clamping force to prevent mould flash",
          icon: "🔩",
          color: "--green",
          tag: "Tooling",
          fields: [
            {
              key: "projArea",
              label: "Projected Part Area",
              unit: "cm²",
              default: "120",
              type: "number",
            },
            {
              key: "cavities",
              label: "Number of Cavities",
              unit: "",
              default: "4",
              type: "number",
            },
            {
              key: "runnerArea",
              label: "Runner Projected Area",
              unit: "cm²",
              default: "18",
              type: "number",
            },
            {
              key: "cavPressure",
              label: "Cavity Pressure (avg)",
              unit: "MPa",
              default: "35",
              type: "number",
            },
            {
              key: "safety",
              label: "Safety Factor",
              unit: "",
              default: "1.1",
              type: "number",
            },

          compute: (v) => {
            const totalArea = v.projArea * v.cavities + v.runnerArea;
            const forceKN = (totalArea * v.cavPressure * 100 * v.safety) / 1000;
            const forceTons = forceKN / 9.81;
            return {
              main: forceTons.toFixed(0) + " t",
              label: "Required Clamping Force",
              rows: [
                { k: "Total projected area", v: totalArea.toFixed(1) + " cm²" },
                { k: "Cavity pressure", v: v.cavPressure + " MPa" },
                { k: "Clamping force (kN)", v: forceKN.toFixed(1) + " kN" },
                {
                  k: "Clamping force (metric tons)",
                  v: forceTons.toFixed(0) + " t",
                },
                { k: "Safety factor applied", v: "x" + v.safety },
              ],
            };

        },

          name: "Material Consumption",
          desc: "Calculate raw material needed for a production run including scrap",
          icon: "🧱",
          color: "--yellow",
          tag: "Planning",
          fields: [
            {
              key: "partWeight",
              label: "Part Weight",
              unit: "g",
              default: "85",
              type: "number",
            },
            {
              key: "qty",
              label: "Order Quantity",
              unit: "pcs",
              default: "10000",
              type: "number",
            },
            {
              key: "scrapRate",
              label: "Scrap Rate",
              unit: "%",
              default: "2.5",

            },
            {
              key: "runnerWeight",
              label: "Runner Weight",

              default: "22",

            },

              key: "regrindRatio",

              unit: "%",
              default: "15",

            const goodParts = v.qty / (1 - v.scrapRate / 100);

                  k: "Parts to produce (incl. scrap)",

              key: "goodParts",
              label: "Good Parts",
              unit: "pcs",
              default: "955",
              type: "number",
            },
          ],
          compute: (v) => {
            const runTime = v.planTime - v.downTime;
            const avail = runTime / v.planTime;
            const idealParts = (runTime * 3600) / v.idealCycle;
            const perf = v.totalParts / idealParts;
            const qual = v.goodParts / v.totalParts;
            const oee = avail * perf * qual * 100;
            return {
              main: oee.toFixed(1) + "%",
              label: "Overall Equipment Effectiveness",
              rows: [
                { k: "Availability", v: (avail * 100).toFixed(1) + "%" },
                { k: "Performance", v: (perf * 100).toFixed(1) + "%" },
                { k: "Quality", v: (qual * 100).toFixed(1) + "%" },
                { k: "OEE", v: oee.toFixed(1) + "%" },
                { k: "World-class benchmark", v: "≥ 85%" },
              ],
            };
          },
        },
        {
          id: "calc-cooling",
          name: "Cooling Line Flow Rate",
          desc: "Determine required coolant flow for adequate mould temperature control",
          icon: "❄️",
          color: "--blue",
          tag: "Process",
          fields: [
            {
              key: "shotWeight",
              label: "Shot Weight",
              unit: "g",
              default: "340",
              type: "number",
            },
            {
              key: "cycleTime",
              label: "Cycle Time",
              unit: "s",
              default: "28",
              type: "number",
            },
            {
              key: "meltTemp",
              label: "Melt Temperature",
              unit: "°C",
              default: "220",
              type: "number",
            },
            {
              key: "ejectTemp",
              label: "Ejection Temperature",
              unit: "°C",
              default: "90",
              type: "number",
            },
            {
              key: "coolantIn",
              label: "Coolant Inlet Temp",
              unit: "°C",
              default: "12",
              type: "number",
            },
            {
              key: "coolantOut",
              label: "Coolant Outlet Temp",
              unit: "°C",
              default: "18",
              type: "number",
            },
            {
              key: "heatCapacity",
              label: "Material Heat Capacity",
              unit: "J/g·K",
              default: "1.4",
              type: "number",
            },
          ],
          compute: (v) => {
            const heatRemoved =
              v.shotWeight * v.heatCapacity * (v.meltTemp - v.ejectTemp);
            const heatPerSec = heatRemoved / v.cycleTime;
            const deltaT = v.coolantOut - v.coolantIn;
            const flowGrams = heatPerSec / (4.18 * deltaT);
            const flowLPM = (flowGrams * 60) / 1000;
            return {
              main: flowLPM.toFixed(2) + " L/min",
              label: "Required Coolant Flow Rate",
              rows: [
                {
                  k: "Total heat to remove",
                  v: (heatRemoved / 1000).toFixed(2) + " kJ/shot",
                },
                { k: "Heat removal rate", v: heatPerSec.toFixed(1) + " W" },
                { k: "Coolant ΔT", v: deltaT + " °C" },
                { k: "Flow rate", v: flowLPM.toFixed(2) + " L/min" },
                {
                  k: "Turbulent flow (Re > 4000) needed",
                  v: "> 4 L/min recommended",
                },
              ],
            };
          },
        },
        {
          id: "calc-extruder",
          name: "Extruder Output Estimator",
          desc: "Estimate throughput for single-screw extruder based on screw geometry",
          icon: "🌀",
          color: "--green",
          tag: "Extrusion",
          fields: [
            {
              key: "screwDia",
              label: "Screw Diameter",
              unit: "mm",
              default: "45",
              type: "number",
            },
            {
              key: "pitch",
              label: "Screw Pitch",
              unit: "mm",
              default: "45",
              type: "number",
            },
            {
              key: "channelDepth",
              label: "Channel Depth (metering)",
              unit: "mm",
              default: "3.5",
              type: "number",
            },
            {
              key: "rpm",
              label: "Screw Speed",
              unit: "RPM",
              default: "80",
              type: "number",
            },
            {
              key: "density",
              label: "Melt Density",
              unit: "g/cm³",
              default: "0.95",
              type: "number",
            },
            {
              key: "efficiency",
              label: "Volumetric Efficiency",
              unit: "%",
              default: "85",
              type: "number",
            },
          ],
          compute: (v) => {
            const D = v.screwDia / 10; // cm
            const h = v.channelDepth / 10; // cm
            const p = v.pitch / 10; // cm
            const W = Math.PI * D - h; // approximate channel width
            const Qd =
              0.5 *
              Math.PI ** 2 *
              D *
              h *
              W *
              Math.sin(Math.atan(p / (Math.PI * D))) *
              Math.cos(Math.atan(p / (Math.PI * D))) *
              (v.rpm / 60);
            const Qnet = Qd * (v.efficiency / 100);
            const throughputKgH = (Qnet * v.density * 3600) / 1000;
            return {
              main: throughputKgH.toFixed(1) + " kg/h",
              label: "Estimated Throughput",
              rows: [
                { k: "Drag flow (Qd)", v: (Qd * 1000).toFixed(2) + " cm³/s" },
                {
                  k: "Net flow (with efficiency)",
                  v: (Qnet * 1000).toFixed(2) + " cm³/s",
                },
                { k: "Throughput", v: throughputKgH.toFixed(1) + " kg/h" },
                {
                  k: "Daily throughput (24h)",
                  v: (throughputKgH * 24).toFixed(0) + " kg/day",
                },
                { k: "Screw L/D assumption", v: "24:1 (standard)" },
              ],
            };
          },
        },
      ];

      function DonutChart({ pct, color, label }) {
        const r = 50,
          cx = 60,
          cy = 60,
          strokeW = 10;
        const circ = 2 * Math.PI * r;
        const dash = (pct / 100) * circ;
        return (
          <div className="donut-wrap" style={{ width: 120, height: 120 }}>
            <svg width="120" height="120" viewBox="0 0 120 120">
              <circle
                cx={cx}
                cy={cy}
                r={r}
                fill="none"
                stroke="var(--border)"
                strokeWidth={strokeW}
              />
              <circle
                cx={cx}
                cy={cy}
                r={r}
                fill="none"
                stroke={color}
                strokeWidth={strokeW}
                strokeDasharray={`${dash} ${circ}`}
                strokeLinecap="round"
                transform="rotate(-90 60 60)"
              />
            </svg>
            <div className="donut-label">
              <div className="big">{pct}%</div>
              <div className="small">{label}</div>
            </div>
          </div>
        );
      }

      function CalcModal({ calc, onClose, onSave }) {
        const [values, setValues] = useState(() =>
          Object.fromEntries(
            calc.fields.map((f) => [f.key, parseFloat(f.default)]),
          ),
        );
        const [result, setResult] = useState(null);

        const compute = () => {
          try {
            setResult(calc.compute(values));
          } catch (e) {
            setResult({ main: "Error", label: "Check inputs", rows: [] });
          }
        };

        return (
          <div
            className="modal-overlay"
            onClick={(e) => e.target === e.currentTarget && onClose()}
          >
            <div className="modal">
              <button className="modal-close" onClick={onClose}>
                ✕
              </button>
              <div className="modal-title">
                {calc.icon} {calc.name}
              </div>
              <p
                style={{
                  fontFamily: "var(--body)",
                  fontSize: 13,
                  color: "var(--text3)",
                  marginBottom: 20,
                }}
              >
                {calc.desc}
              </p>

              <div
                className="input-row"
                style={{ gridTemplateColumns: "1fr 1fr" }}
              >
                {calc.fields.map((f) => (
                  <div key={f.key} className="input-group">
                    <div className="input-label">
                      {f.label}
                      {f.unit && (
                        <span style={{ color: "var(--accent)", marginLeft: 4 }}>
                          [{f.unit}]
                        </span>
                      )}
                    </div>
                    <input
                      className="input"
                      type="number"
                      step="any"
                      value={values[f.key]}
                      onChange={(e) =>
                        setValues((v) => ({
                          ...v,
                          [f.key]: parseFloat(e.target.value) || 0,
                        }))
                      }
                    />
                  </div>
                ))}
              </div>

              <div style={{ display: "flex", gap: 10, marginTop: 6 }}>
                <button className="btn btn-primary" onClick={compute}>
                  Calculate
                </button>
                <button className="btn btn-ghost" onClick={onClose}>
                  Cancel
                </button>
              </div>

              {result && (
                <div className="result-box">
                  <div className="result-title">⟶ {result.label}</div>
                  <div className="result-main">{result.main}</div>
                  {result.rows.map((r, i) => (
                    <div key={i} className="result-row">
                      <span className="result-key">{r.k}</span>
                      <span className="result-val">{r.v}</span>
                    </div>
                  ))}
                  <div style={{ marginTop: 14, display: "flex", gap: 8 }}>
                    <button
                      className="btn btn-success btn-sm"
                      onClick={() => onSave(calc.name, result)}
                    >
                      💾 Save to PDF
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

                  },
                  { k: "Target", v: machine.target.toLocaleString() + " pcs" },
                  { k: "Rejects Today", v: machine.rejects },
                  { k: "Energy Today", v: machine.energyKWh + " kWh" },
                  { k: "Last Maintenance", v: machine.lastMaint },
                  { k: "Next Maintenance", v: machine.nextMaint },
                ].map((s) => (
                  <div key={s.k} className="spec-item">
                    <div className="spec-key">{s.k}</div>
                    <div className="spec-val">{s.v}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Barrel temperature profile */}
            {machine.barrelTemp && machine.barrelTemp.some((t) => t > 0) && (
              <div className="card mb-6">
                <div className="card-title">
                  <span className="dot" style={{ background: "var(--red)" }} />{" "}
                  Barrel Temperature Profile
                </div>
                <div
                  style={{ display: "flex", gap: 12, alignItems: "flex-end" }}
                >
                  {machine.barrelTemp.map((t, i) => (
                    <div key={i} style={{ flex: 1, textAlign: "center" }}>
                      <div
                        style={{
                          fontFamily: "var(--mono)",
                          fontSize: 11,
                          color: "var(--accent)",
                          marginBottom: 4,
                        }}
                      >
                        {t}°C
                      </div>
                      <div
                        style={{
                          height: 60,
                          background: "var(--border)",
                          borderRadius: 3,
                          position: "relative",
                          overflow: "hidden",
                        }}
                      >
                        <div
                          style={{
                            position: "absolute",
                            bottom: 0,
                            left: 0,
                            right: 0,
                            height: `${(t / 300) * 100}%`,
                            background: `linear-gradient(to top, var(--red), var(--accent))`,
                          }}
                        />
                      </div>
                      <div
                        style={{
                          fontFamily: "var(--mono)",
                          fontSize: 9,
                          color: "var(--text3)",
                          marginTop: 4,
                        }}
                      >
                        Z{i + 1}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Actions */}
            <div className="card mb-6">
              <div className="card-title">
                <span className="dot" style={{ background: "var(--blue)" }} />{" "}
                Machine Actions
              </div>
              <div className="action-grid">
                {[
                  {
                    icon: "▶️",
                    label: "Start Production",
                    disabled: machine.status === "Running",
                  },
                  {
                    icon: "⏸️",
                    label: "Pause Machine",
                    disabled: machine.status !== "Running",
                  },
                  { icon: "⏹️", label: "Emergency Stop", disabled: false },
                  {
                    icon: "🔧",
                    label: "Schedule Maintenance",
                    disabled: false,
                  },
                  { icon: "📊", label: "Generate Report", disabled: false },
                  {
                    icon: "🔄",
                    label: "Mould Change",
                    disabled: machine.status === "Running",
                  },
                  {
                    icon: "⚙️",
                    label: "Adjust Parameters",
                    disabled: machine.status !== "Running",
                  },
                  { icon: "📡", label: "Diagnostics Run", disabled: false },
                ].map((a) => (
                  <div
                    key={a.label}
                    className="action-card"
                    style={
                      a.disabled ? { opacity: 0.35, cursor: "not-allowed" } : {}
                    }
                    onClick={() => !a.disabled && doAction(a.label)}
                  >
                    <div className="action-icon">{a.icon}</div>
                    <div className="action-label">{a.label}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Action log */}
            {actionLog.length > 0 && (
              <div className="card">
                <div className="card-title">
                  <span
                    className="dot"
                    style={{ background: "var(--green)" }}
                  />{" "}
                  Action Log
                </div>
                {actionLog.map((e, i) => (
                  <div key={i} className="log-entry">
                    <span className="log-time">{e.time}</span>
                    <div className="log-msg">
                      <span className="log-tag badge badge-blue">action</span>
                      {e.label} sent to {machine.name}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      function PageMachines({ showToast }) {
        const [selected, setSelected] = useState(null);
        const [search, setSearch] = useState("");
        const [filterType, setFilterType] = useState("All");

        if (selected)
          return (
            <MachineDetail
              machine={selected}
              onBack={() => setSelected(null)}
              showToast={showToast}
            />
          );

        const types = ["All", ...new Set(MACHINES.map((m) => m.type))];
        const filtered = MACHINES.filter((m) => {
          const matchType = filterType === "All" || m.type === filterType;
          const matchSearch =
            search === "" ||
            m.name.toLowerCase().includes(search.toLowerCase()) ||
            m.id.toLowerCase().includes(search.toLowerCase());
          return matchType && matchSearch;
        });

        return (
          <div>
            <div className="flex-between mb-6">
              <div className="pill-tabs">
                {types.map((t) => (
                  <div
                    key={t}
                    className={`pill-tab ${filterType === t ? "active" : ""}`}
                    onClick={() => setFilterType(t)}
                  >
                    {t}
                  </div>
                ))}
              </div>
              <input
                className="search-box"
                placeholder="Search machines..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
              />
            </div>

            <div className="card" style={{ marginBottom: 20 }}>
              <div className="table-wrap">
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Machine</th>
                      <th>Type</th>
                      <th>Status</th>
                      <th>Operator</th>
                      <th>Material</th>
                      <th>Output / Target</th>
                      <th>Uptime</th>
                      <th>Temp (°C)</th>
                      <th>Pressure</th>
                      <th>Last Maint.</th>
                      <th>Location</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map((m) => (
                      <tr key={m.id} onClick={() => setSelected(m)}>
                        <td className="mono" style={{ color: "var(--accent)" }}>
                          {m.id}
                        </td>
                        <td style={{ fontWeight: 600 }}>{m.name}</td>
                        <td style={{ color: "var(--text3)", fontSize: 12 }}>
                          {m.type}
                        </td>
                        <td>
                          <StatusBadge status={m.status} />
                        </td>
                        <td style={{ fontSize: 12, color: "var(--text2)" }}>
                          {m.operator}
                        </td>
                        <td className="mono">{m.material}</td>
                        <td>
                          <div
                            style={{
                              display: "flex",
                              alignItems: "center",
                              gap: 6,
                            }}
                          >
                            <span className="mono" style={{ fontSize: 11 }}>
                              {m.output.toLocaleString()} /{" "}
                              {m.target.toLocaleString()}
                            </span>
                            <div
                              style={{
                                width: 40,
                                height: 3,
                                background: "var(--border)",
                                borderRadius: 2,
                              }}
                            >
                              <div
                                style={{
                                  height: "100%",
                                  background: "var(--accent)",
                                  borderRadius: 2,
                                  width: `${m.target > 0 ? Math.round((m.output / m.target) * 100) : 0}%`,
                                }}
                              />
                            </div>
                          </div>
                        </td>
                        <td>
                          <span
                            className="mono"
                            style={{
                              color:
                                m.uptime > 80
                                  ? "var(--green)"
                                  : m.uptime > 50
                                    ? "var(--yellow)"
                                    : "var(--red)",
                            }}
                          >
                            {m.uptime > 0 ? m.uptime + "%" : "—"}
                          </span>
                        </td>
                        <td
                          className="mono"
                          style={{
                            color:
                              m.temp > 0 ? "var(--accent)" : "var(--text3)",
                          }}
                        >
                          {m.temp > 0 ? m.temp : "—"}
                        </td>
                        <td className="mono" style={{ fontSize: 12 }}>
                          {m.pressure > 0 ? m.pressure + " bar" : "—"}
                        </td>
                        <td
                          className="mono"
                          style={{ fontSize: 11, color: "var(--text3)" }}
                        >
                          {m.lastMaint}
                        </td>
                        <td style={{ fontSize: 12, color: "var(--text3)" }}>
                          {m.location}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Machine cards */}
            <div className="grid-3">
              {filtered.map((m) => {
                const statusColor =
                  {
                    Running: "var(--green)",
                    Idle: "var(--blue)",
                    Maintenance: "var(--yellow)",
                    Fault: "var(--red)",
                  }[m.status] || "var(--text3)";
                return (
                  <div
                    key={m.id}
                    className="card"
                    style={{ cursor: "pointer", transition: "all 0.15s" }}
                    onClick={() => setSelected(m)}
                    onMouseEnter={(e) =>
                      (e.currentTarget.style.borderColor = "var(--accent)")
                    }
                    onMouseLeave={(e) =>
                      (e.currentTarget.style.borderColor = "var(--border)")
                    }
                  >
                    <div
                      style={{
                        display: "flex",
                        justifyContent: "space-between",
                        marginBottom: 10,
                      }}
                    >
                      <div
                        style={{
                          fontFamily: "var(--mono)",
                          fontSize: 10,
                          color: "var(--accent)",
                        }}
                      >
                        {m.id}
                      </div>
                      <StatusBadge status={m.status} />
                    </div>
                    <div
                      style={{
                        fontFamily: "var(--head)",
                        fontWeight: 700,
                        fontSize: 15,
                        color: "var(--text)",
                        marginBottom: 2,
                      }}
                    >
                      {m.name}
                    </div>
                    <div
                      style={{
                        fontFamily: "var(--mono)",
                        fontSize: 10,
                        color: "var(--text3)",
                        marginBottom: 12,
                      }}
                    >
                      {m.type} · {m.location}
                    </div>
                    {m.status === "Running" && (
                      <>
                        <div
                          style={{
                            height: 3,
                            background: "var(--border)",
                            borderRadius: 2,
                            marginBottom: 6,
                          }}
                        >
                          <div
                            style={{
                              height: "100%",
                              background: statusColor,
                              borderRadius: 2,
                              width: `${Math.round((m.output / m.target) * 100)}%`,
                            }}
                          />
                        </div>
                        <div
                          style={{
                            display: "flex",
                            justifyContent: "space-between",
                            fontFamily: "var(--mono)",
                            fontSize: 10,
                            color: "var(--text3)",
                          }}
                        >
                          <span>{m.output.toLocaleString()} pcs</span>
                          <span>
                            {Math.round((m.output / m.target) * 100)}% of target
                          </span>
                        </div>
                      </>
                    )}
                    <div
                      style={{
                        marginTop: 10,
                        display: "flex",
                        gap: 10,
                        fontFamily: "var(--mono)",
                        fontSize: 10,
                        color: "var(--text3)",
                      }}
                    >
                      {m.temp > 0 && <span>🌡 {m.temp}°C</span>}
                      {m.pressure > 0 && <span>◈ {m.pressure} bar</span>}
                      <span>⟳ {m.cycles.toLocaleString()} cycles</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // ─── ROOT APP ─────────────────────────────────────────────────────────────────

      const PAGES = [
        { id: "home", label: "Overview", icon: "⬡", section: "main" },
        { id: "dashboard", label: "Dashboard", icon: "◈", section: "main" },
        { id: "machines", label: "Machines", icon: "⚙", section: "production" },
        { id: "orders", label: "Orders", icon: "◻", section: "production" },
        {
          id: "inventory",
          label: "Inventory",
          icon: "⬢",
          section: "production",
        },
        {
          id: "calculations",
          label: "Kalkulationer",
          icon: "∑",
          section: "tools",
        },
      ];

      const PAGE_TITLES = {
        home: "Plant Overview",
        dashboard: "Live Dashboard",
        machines: "Machine Fleet",
        orders: "Order Management",
        inventory: "Inventory Control",
        calculations: "Kalkulationer",
      };

      function App() {
        const [page, setPage] = useState("home");
        const [toast, setToast] = useState(null);

        const showToast = (msg) => {
          setToast(msg);
        };

        const sections = [...new Set(PAGES.map((p) => p.section))];

        return (
          <div className="app">
            <aside className="sidebar">
              <div className="sidebar-logo">
                <div className="brand">PolyCore</div>
                <div className="sub">Manufacturing Execution System</div>
              </div>
              <nav className="sidebar-nav">
                {sections.map((sec) => (
                  <div key={sec}>
                    <div className="nav-section-label">{sec}</div>
                    {PAGES.filter((p) => p.section === sec).map((p) => (
                      <div
                        key={p.id}
                        className={`nav-item ${page === p.id ? "active" : ""}`}
                        onClick={() => setPage(p.id)}
                      >
                        <span className="icon">{p.icon}</span>
                        {p.label}
                      </div>
                    ))}
                  </div>
                ))}
              </nav>
              <div className="sidebar-footer">
                <div>
                  <span className="status-dot" />
                  System Online
                </div>
                <div style={{ marginTop: 4, color: "var(--text3)" }}>
                  v2.4.1 · Halmstad
                </div>
              </div>
            </aside>

            <div className="main">
              <div className="topbar">
                <div className="topbar-title">{PAGE_TITLES[page]}</div>
                <div className="topbar-right">
                  <Clock />
                  <span className="topbar-badge">DAY SHIFT</span>
                  <div
                    style={{
                      width: 28,
                      height: 28,
                      borderRadius: "50%",
                      background: "var(--accent)",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontFamily: "var(--head)",
                      fontWeight: 700,
                      fontSize: 13,
                      color: "#000",
                      cursor: "pointer",
                    }}
                  >
                    PM
                  </div>
                </div>
              </div>
              <div className="content">
                {page === "home" && <PageHome setPage={setPage} />}
                {page === "dashboard" && <PageDashboard />}
                {page === "machines" && <PageMachines showToast={showToast} />}
                {page === "orders" && <PageOrders />}
                {page === "inventory" && <PageInventory />}
                {page === "calculations" && (
                  <PageCalculations showToast={showToast} />
                )}
              </div>
            </div>

            {toast && <Toast msg={toast} onClose={() => setToast(null)} />}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
